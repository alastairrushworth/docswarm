# ----- Project identity -----
repo:
  url:             "git@github.com:alastairrushworth/docswarm.git"
  branch:          "development"
  deploy_key_path: "/workspace/secrets/deploy_key"  # staged by `make setup`; /root/.ssh also set

runpod:
  # API key: export RUNPOD_API_KEY=<key>  (do not store here)
  # Check GPU availability and find your datacenter_id at:
  #   https://www.runpod.io/gpu-instance/pricing
  # All >=80GB VRAM — anything smaller OOMs (see comment ~line 100). Tried in
  # order, so the cheaper 80GB cards come first; the 94/141GB cards are headroom
  # fallbacks that widen availability when the 80GB pool is empty.
  gpu_type_ids:
    - "NVIDIA H100 80GB HBM3"
    - "NVIDIA H100 PCIe"
    - "NVIDIA A100-SXM4-80GB"
    - "NVIDIA A100 80GB PCIe"
    - "NVIDIA H100 NVL"
    - "NVIDIA H200"
  image:             "runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04"
  container_disk_gb: 50
  volume_size_gb:    600        # network volume for /workspace (repo + Ollama model cache)
  datacenter_id:     "US-KS-2"  # override if unavailable; see runpod.io/gpu-instance/pricing
  network_volume_id: "rc6qcrbkf5"  # auto-filled by `make setup`
  pod_name:          "docswarm"

# ----- Models (Ollama tags) -----
# qwen3.6:35b is multimodal (Text + Image) and covers all three LLM roles —
# coder (Claude Code dev agent), vision (per-page extraction) and judge
# (marking) — so a single 35B model stays resident plus the embedder. This
# avoids holding a second large model (e.g. nemotron3:33b) in VRAM alongside it,
# and qwen-VL's dynamic-resolution tiling gives more image detail per page than
# nemotron's single 256-token slice.
models:
  # qwen3.6:35b is multimodal (Text + Image), 24GB, 256K ctx. The `27b-coding-*`
  # and `*-mlx-*` tags are MLX (Apple Silicon only) and will 412 on Linux.
  coder:     "qwen3.6:35b"
  vision:    "qwen3.6:35b"
  judge:     "qwen3.6:35b"
  embedding: "nomic-embed-text"       # ~270MB, similarity scoring

# ----- Iteration control -----
iteration:
  wall_clock_hours:           12
  page_concurrency:           4          # matches OLLAMA_NUM_PARALLEL; 55 GiB free VRAM fits 4 KV caches
  pdf_concurrency:            1          # one val doc currently; raise when more docs added
  per_call_timeout_seconds:   300        # per-page timeout; 300s covers slow generation
  page_dpi:                   150        # render resolution; 200 DPI → ~20 tiles, 150 DPI → ~10 tiles
  page_format:                "jpeg"     # jpeg (smaller payload) or png (lossless)
  # Per-page vision context window, DECOUPLED from ollama.context_length (64k).
  # One magazine page needs ~3-6k tokens (image tiles + prompt + JSON out). The
  # global 64k default was being applied to the vision model too, forcing Ollama
  # to reserve num_ctx x num_parallel KV cache (~60 GB on a 33B model) which
  # OOM-crashed the server mid-run (→ connection-refused cascade, not slowness).
  vision_num_ctx:             8192       # context window for a single-page vision call
  vision_num_predict:         4096       # cap on generated JSON tokens per page
  # nemotron3 is a reasoning model. Left on, it spends the entire num_predict
  # budget on hidden chain-of-thought and returns an empty `response`
  # (out_tokens=4096, done=length) — the page is lost and ~23s of GPU wasted.
  # Disabled, it emits the JSON directly.
  vision_think:               false      # send "think": false on vision calls
  epsilon:                    0.005
  min_rounds_before_plateau:  3
  plateau_aggregate_floor:    0.30
  plateau_window:             3

# ----- Broad-mode scoring weights (sum to 1.0) -----
weights:
  schema_validity: 0.10
  article_count:   0.10
  metadata:        0.15
  titles:          0.15
  text:            0.30
  order:           0.10
  pages:           0.10

# ----- Judge: non-leakage policy -----
leakage:
  allow_structural_hints:        true
  hint_overlap_filter_threshold: 0.30

# ----- Judge: essence-over-form scoring -----
# Surface-form differences (punctuation, case, accents, abbreviation, OCR noise)
# must not be marked wrong. Per-field metadata and per-article titles score
# graded partial credit; at/above their band they snap to full credit.
# alignment_floor is the minimum combined title+text similarity for two articles
# to be considered the same one — below it, a predicted article is treated as
# extra and an unmatched truth article as missing, rather than force-paired.
judge:
  alignment_floor: 0.15
  bands:
    metadata: 0.90
    title:    0.85
  # Embedding circuit breaker for text-similarity scoring. The article-alignment
  # matrix embeds every unique article text; if the embed model stalls, a short
  # timeout plus a cooldown keeps a broad eval from exceeding the harness's 600s
  # judge window — it falls back to jaccard instead of N serial timeouts.
  embed_timeout_seconds:  8
  embed_cooldown_seconds: 60

# ----- Single Ollama instance shared by translator + agent + judge -----
ollama:
  url:                "http://localhost:11434"
  # KV cache reserved per loaded model = context_length x num_parallel. At 64k x 4
  # the coder's reload to serve Claude Code reserved ~60 GB and OOM'd the 80 GB A100
  # mid-load (SSH reset, pod torn down). num_parallel=2 -> ~30 GB KV + ~20 GB weights
  # fits with margin, while keeping 2x parallelism for the per-page vision pass.
  num_parallel:       2                  # OLLAMA_NUM_PARALLEL on the server
  max_loaded_models:  3                  # qwen3.6:35b (coder+vision+judge) + embedding
  keep_alive:         "24h"
  context_length:     65536              # Claude Code requires ≥64k

# ----- Paths (inside containers) -----
# Each document lives in its own folder under a split dir, e.g.
# data/val/sporting-cyclist-vol1959-06/{original.pdf,transcribed.json}.
# The folder name is the pdf_id.
paths:
  workspace:        "/workspace"
  train_dir:        "/workspace/data/train"
  val_dir:          "/workspace/data/val"
  test_dir:         "/workspace/data/test"        # final user review only
  pdf_filename:     "original.pdf"                # source PDF inside each doc folder
  truth_filename:   "transcribed.json"            # ground truth inside each doc folder (judge only)
  inbox_dir:        "/workspace/judge/inbox"
  feedback_dir:     "/workspace/judge/feedback"
  trends_file:      "/workspace/trends/round_history.json"
  notes_file:       "/workspace/notes/approach.md"   # agent's durable cross-round memory
  cache_dir:        "/workspace/.cache/pdf_to_json"
