# ----- Project identity -----
repo:
  url:             "git@github.com:alastairrushworth/docswarm.git"
  branch:          "development"
  deploy_key_path: "/secrets/deploy_key"            # mounted into developer-agent container

digitalocean:
  # gpu-h200x1-141gb is offered ONLY in nyc2; gpu-h100x1-80gb ONLY in ams3.
  # The snapshot (226981253) has been transferred to BOTH nyc2 and ams3, so a
  # cross-region fallback now works. The launcher tries every (size, region)
  # pair — sizes outer, regions inner — skipping combinations that 422 with
  # "not available in this region":
  #   1. H200 @ nyc2  (primary; H200's only region)
  #   2. H200 @ ams3  -> 422, skipped
  #   3. H100 @ nyc2  -> 422, skipped
  #   4. H100 @ ams3  (fallback when nyc2 H200 capacity is exhausted)
  # H100 is 80GB vs H200 141GB, but the loadout is a single resident
  # qwen3.6:35b (~24GB, shared by coder/vision/judge) + nomic-embed, so it fits.
  region:
    - "nyc2"
  region_fallbacks:
    - "ams3"
  size:
    - "gpu-h200x1-141gb"
  size_fallbacks:
    - "gpu-h100x1-80gb"
  snapshot_id:    "226981253"                          # auto-filled by `make snapshot`
  ssh_key_id:     "55897353"                          # `doctl compute ssh-key list` → ID
  droplet_name:   "docswarm-h200"
  # ----- Snapshot setup (`make snapshot`) -----
  # Setup droplet pulls ~60GB of model weights and installs Docker / NVIDIA
  # toolkit / Ollama. Must be a GPU SKU in `region` so the snapshot inherits
  # NVIDIA drivers. Build on a 500GB-disk card (L40S/6000 Ada) so the resulting
  # snapshot's min_disk_size is 500GB and can restore on L40S/Ada AND H100/H200
  # — unlike the old H200-built snapshot (720GB) which only fit H100/H200.
  # Build sweep tries these sizes across `region`+`region_fallbacks`.
  snapshot_size:
    - "gpu-l40sx1-48gb"
    - "gpu-6000adax1-48gb"
  snapshot_image: "gpu-h100x1-base"           # NVIDIA AI/ML Ready (generic across NVIDIA GPUs)

# ----- Models (Ollama tags) -----
# Two Ollama models loaded concurrently in a single Ollama server:
#  - coder: drives Claude Code (developer agent) and the judge LLM (marking)
#  - vision: multimodal, drives the translator's per-page extraction
# Embedding stays loaded alongside.
models:
  # qwen3.6:35b is multimodal (Text + Image), 24GB, 256K ctx — one model
  # covers all three roles. The `27b-coding-*` and `*-mlx-*` tags are MLX
  # (Apple Silicon only) and will 412 on Linux.
  coder:     "qwen3.6:35b"
  vision:    "qwen3.6:35b"            # same model serves both roles
  judge:     "qwen3.6:35b"
  embedding: "nomic-embed-text"       # ~270MB, similarity scoring

# ----- Iteration control -----
iteration:
  wall_clock_hours:           12
  page_concurrency:           4          # parallel page extractions per PDF
  pdf_concurrency:            3          # parallel PDFs in a broad round
  epsilon:                    0.005
  min_rounds_before_plateau:  3
  plateau_aggregate_floor:    0.30
  plateau_window:             3

# ----- Broad-mode scoring weights (sum to 1.0) -----
weights:
  schema_validity: 0.10
  article_count:   0.10
  metadata:        0.15
  titles:          0.15
  text:            0.30
  order:           0.10
  pages:           0.10

# ----- Judge: non-leakage policy -----
leakage:
  allow_structural_hints:        true
  hint_overlap_filter_threshold: 0.30

# ----- Judge: essence-over-form scoring -----
# Surface-form differences (punctuation, case, accents, abbreviation, OCR noise)
# must not be marked wrong. Per-field metadata and per-article titles score
# graded partial credit; at/above their band they snap to full credit.
# alignment_floor is the minimum combined title+text similarity for two articles
# to be considered the same one — below it, a predicted article is treated as
# extra and an unmatched truth article as missing, rather than force-paired.
judge:
  alignment_floor: 0.15
  bands:
    metadata: 0.90
    title:    0.85

# ----- Single Ollama instance, two models loaded, shared by translator + agent + judge -----
ollama:
  url:                "http://ollama-main:11434"
  num_parallel:       4                  # OLLAMA_NUM_PARALLEL on the server
  max_loaded_models:  2                  # qwen3.6:35b (multimodal) + embedding
  keep_alive:         "24h"
  context_length:     65536              # Claude Code requires ≥64k

# ----- Paths (inside containers) -----
# Each document lives in its own folder under a split dir, e.g.
# data/val/sporting-cyclist-vol1959-06/{original.pdf,transcribed.json}.
# The folder name is the pdf_id.
paths:
  workspace:        "/workspace"
  train_dir:        "/workspace/data/train"
  val_dir:          "/workspace/data/val"
  test_dir:         "/workspace/data/test"        # final user review only
  pdf_filename:     "original.pdf"                # source PDF inside each doc folder
  truth_filename:   "transcribed.json"            # ground truth inside each doc folder (judge only)
  inbox_dir:        "/workspace/judge/inbox"
  feedback_dir:     "/workspace/judge/feedback"
  trends_file:      "/workspace/trends/round_history.json"
  notes_file:       "/workspace/notes/approach.md"   # agent's durable cross-round memory
  cache_dir:        "/workspace/.cache/pdf_to_json"
