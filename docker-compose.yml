services:
  ollama-main:
    image: ollama/ollama:latest
    container_name: ollama-main
    networks: [docswarm]
    volumes:
      - /workspace/ollama-data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=3
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_CONTEXT_LENGTH=65536
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  judge:
    build:
      context: .
      dockerfile: docker/judge.Dockerfile
    container_name: judge
    networks: [docswarm]
    depends_on:
      ollama-main:
        condition: service_healthy
    environment:
      - DOCSWARM_CONFIG=/workspace/config.yaml
      - OLLAMA_URL=http://ollama-main:11434
    volumes:
      - ./config.yaml:/workspace/config.yaml:ro
      - ./judge:/workspace/judge
      # Ground truth (transcribed.json) lives inside each val doc folder; judge sees all of val.
      - ./data/val:/workspace/data/val:ro
      - ./trends:/workspace/trends
    restart: unless-stopped
    command: ["python", "-m", "judge.judge"]

  developer-agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    container_name: developer-agent
    networks: [docswarm]
    depends_on:
      ollama-main:
        condition: service_healthy
      judge:
        condition: service_started
    environment:
      - DOCSWARM_CONFIG=/workspace/config.yaml
      - OLLAMA_URL=http://ollama-main:11434
      # Claude Code → local Ollama via Anthropic-compatible API.
      - ANTHROPIC_BASE_URL=http://ollama-main:11434
      - ANTHROPIC_AUTH_TOKEN=ollama
      - ANTHROPIC_API_KEY=
    volumes:
      # data/test is deliberately NOT mounted into this container. NOTE: val truth
      # (transcribed.json) is co-located with original.pdf in each data/val/<doc>/
      # folder, so mounting val for the PDFs also exposes ground truth here.
      - ./module:/workspace/module
      # Judge package (ro) so the agent can self-score on TRAIN via
      # scripts/score_train.py, reusing judge.broad. inbox/feedback are nested
      # rw/ro mounts below and take precedence over this read-only parent.
      - ./judge:/workspace/judge:ro
      - ./judge/inbox:/workspace/judge/inbox
      - ./judge/feedback:/workspace/judge/feedback:ro
      - ./scripts:/workspace/scripts
      - ./trends:/workspace/trends
      # Durable cross-round memory the agent maintains and commits.
      - ./notes:/workspace/notes
      - ./orchestration:/workspace/orchestration
      - ./config.yaml:/workspace/config.yaml
      - ./AGENT.md:/workspace/AGENT.md:ro
      - ./DESIGN.md:/workspace/DESIGN.md:ro
      - ./Makefile:/workspace/Makefile:ro
      - ./data/train:/workspace/data/train:ro
      - ./data/val:/workspace/data/val:ro
      - ./.git:/workspace/.git
      - ./secrets:/workspace/secrets:ro
    working_dir: /workspace
    command: ["python", "scripts/run_validation.py"]

networks:
  docswarm:
    driver: bridge
